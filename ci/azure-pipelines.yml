# Azure Pipeline for net-questdb-client
# Triggers on pull requests to main branch

trigger: none

pr:
  branches:
    include:
      - main

variables:
  buildConfiguration: 'Release'
  dotnetVersion: '9.0.x'

strategy:
  matrix:
    Linux:
      vmImage: 'ubuntu-latest'
      osName: 'Linux'
    Windows:
      vmImage: 'windows-latest'
      osName: 'Windows'
    macOS:
      vmImage: 'macOS-latest'
      osName: 'macOS'

pool:
  vmImage: $(vmImage)

steps:
- checkout: self
  submodules: true
  displayName: 'Checkout code with submodules'

- task: UseDotNet@2
  displayName: 'Install .NET 6.0 SDK'
  inputs:
    packageType: 'sdk'
    version: '6.0.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: UseDotNet@2
  displayName: 'Install .NET 7.0 SDK'
  inputs:
    packageType: 'sdk'
    version: '7.0.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: UseDotNet@2
  displayName: 'Install .NET 8.0 SDK'
  inputs:
    packageType: 'sdk'
    version: '8.0.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: UseDotNet@2
  displayName: 'Install .NET 9.0 SDK'
  inputs:
    packageType: 'sdk'
    version: $(dotnetVersion)
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: UseDotNet@2
  displayName: 'Install .NET 10.0 SDK'
  inputs:
    packageType: 'sdk'
    version: '10.0.x'
    installationPath: $(Agent.ToolsDirectory)/dotnet

- task: JavaToolInstaller@0
  displayName: 'Install JDK 25 (to build QuestDB)'
  inputs:
    versionSpec: '25'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'
  condition: eq(variables['osName'], 'Linux')

- script: |
    df -h /
    sudo rm -rf /usr/local/lib/android /opt/ghc /usr/share/swift /opt/hostedtoolcache/CodeQL 2>/dev/null || true
    df -h /
  displayName: 'Free agent disk space (Linux)'
  condition: eq(variables['osName'], 'Linux')

- script: |
    set -e
    git clone --depth 1 https://github.com/questdb/questdb.git questdb-src
    cd questdb-src
    CLIENT_VERSION=$(sed -n 's/.*<questdb.client.version>\(.*\)<\/questdb.client.version>.*/\1/p' core/pom.xml | head -1)
    echo "questdb.client.version=$CLIENT_VERSION"
    PROFILES=build-binaries
    case "$CLIENT_VERSION" in
      *-SNAPSHOT)
        git submodule update --init --depth 1 java-questdb-client
        PROFILES=build-binaries,local-client
        ;;
    esac
    mvn -q -pl core -am -DskipTests -P "$PROFILES" package
    echo "##vso[task.setvariable variable=QUESTDB_REPO]$(pwd)"
  displayName: 'Clone + build QuestDB master'
  condition: eq(variables['osName'], 'Linux')

- task: DotNetCoreCLI@2
  displayName: 'Restore dependencies'
  inputs:
    command: 'restore'
    projects: 'net-questdb-client.sln'

- task: DotNetCoreCLI@2
  displayName: 'Build solution'
  inputs:
    command: 'build'
    projects: 'net-questdb-client.sln'
    arguments: '--configuration $(buildConfiguration) --no-restore'

# Cross-repo trigger: fire the questdb-enterprise
# build-and-test-e2e-net-client pipeline with this build's SHA so
# the net_client-marked failover tests run against an Enterprise
# primary. The Enterprise pipeline posts a status check back on the
# PR (`enterprise-e2e-net-client` context); this step fire-and-forgets.
# The enterprise run uses an enterprise branch of the same name when one
# exists (coordinated change), otherwise enterprise main.
#
# Prerequisites (one-time, in the Azure DevOps UI):
#   1. Register ci/build-and-test-e2e-net-client.yaml in the
#      `questdb-enterprise` ADO project as a pipeline named
#      `build-and-test-e2e-net-client`.
#   2. Create a PAT in the `questdb-enterprise` ADO project with
#      `Build (Read & execute)` scope. Add it as a secret variable
#      on THIS pipeline named ENT_DISPATCH_PAT.
- bash: |
    set -euo pipefail

    ORG_URL="$(System.TeamFoundationCollectionUri)"
    PROJECT="questdb-enterprise"
    PIPELINE_NAME="build-and-test-e2e-net-client"

    if [ -z "${ENT_DISPATCH_PAT:-}" ]; then
      echo "ENT_DISPATCH_PAT not set; skipping enterprise e2e dispatch."
      exit 0
    fi

    echo "Looking up '${PIPELINE_NAME}' in '${PROJECT}'..."
    PIPELINES=$(curl -fsS -u ":${ENT_DISPATCH_PAT}" \
      "${ORG_URL}${PROJECT}/_apis/pipelines?api-version=7.0")
    PIPELINE_ID=$(echo "$PIPELINES" | jq -r --arg n "$PIPELINE_NAME" \
      '.value[] | select(.name == $n) | .id' | head -1)

    if [ -z "$PIPELINE_ID" ] || [ "$PIPELINE_ID" = "null" ]; then
      echo "Pipeline '${PIPELINE_NAME}' not found in '${PROJECT}'; skipping."
      exit 0
    fi

    CLIENT_PR_NUMBER="$(System.PullRequest.PullRequestNumber)"
    if [ -z "${CLIENT_PR_NUMBER}" ] || [ "${CLIENT_PR_NUMBER}" = "None" ]; then
      CLIENT_PR_NUMBER=""
    fi

    if [ "$(Build.Reason)" = "PullRequest" ]; then
      CLIENT_BRANCH="$(System.PullRequest.SourceBranch)"
      CLIENT_BRANCH="${CLIENT_BRANCH#refs/heads/}"
    else
      CLIENT_BRANCH="$(Build.SourceBranchName)"
    fi

    # Run the enterprise pipeline on an enterprise branch of the SAME name when one
    # exists (so a coordinated client+enterprise change is tested together), else
    # fall back to enterprise main. Best-effort: any lookup failure falls back to main.
    ENT_REPO="${ENT_REPO:-questdb-enterprise}"
    ENT_REF="refs/heads/main"
    if [ -n "${CLIENT_BRANCH}" ] && [ "${CLIENT_BRANCH}" != "main" ]; then
      echo "Checking for enterprise branch '${CLIENT_BRANCH}' in ${ENT_REPO}..."
      MATCH=$(curl -fsS -u ":${ENT_DISPATCH_PAT}" \
        "${ORG_URL}${PROJECT}/_apis/git/repositories/${ENT_REPO}/refs?filter=heads/${CLIENT_BRANCH}&api-version=7.0" \
        | jq -r --arg r "refs/heads/${CLIENT_BRANCH}" 'first(.value[]?.name | select(. == $r)) // ""') \
        || MATCH=""
      if [ -n "${MATCH}" ]; then
        ENT_REF="refs/heads/${CLIENT_BRANCH}"
        echo "Found matching enterprise branch; enterprise run will use ${ENT_REF}."
      else
        echo "No matching enterprise branch; enterprise run will use ${ENT_REF}."
      fi
    fi

    BODY=$(jq -n \
      --arg commit "$(Build.SourceVersion)" \
      --arg pr "${CLIENT_PR_NUMBER}" \
      --arg branch "${CLIENT_BRANCH}" \
      --arg entref "${ENT_REF}" \
      '{
        templateParameters: {
          netClientCommit: $commit,
          netClientPrNumber: $pr,
          clientBranch: $branch
        },
        resources: { repositories: { self: { refName: $entref } } }
      }')

    echo "Dispatching enterprise e2e: commit=$(Build.SourceVersion) PR=${CLIENT_PR_NUMBER} branch=${CLIENT_BRANCH} ent_ref=${ENT_REF}"

    RESPONSE=$(curl -fsS -u ":${ENT_DISPATCH_PAT}" \
      -H "Content-Type: application/json" \
      -X POST \
      -d "$BODY" \
      "${ORG_URL}${PROJECT}/_apis/pipelines/${PIPELINE_ID}/runs?api-version=7.0")

    RUN_URL=$(echo "$RESPONSE" | jq -r '._links.web.href // ""')
    echo "Enterprise build queued: ${RUN_URL}"
  displayName: 'Dispatch Enterprise e2e pipeline'
  condition: and(succeeded(), eq(variables['osName'], 'Linux'))
  env:
    ENT_DISPATCH_PAT: $(ENT_DISPATCH_PAT)

- task: DotNetCoreCLI@2
  displayName: 'Run all tests on $(osName) (net8.0)'
  inputs:
    command: 'test'
    projects: 'src/net-questdb-client-tests/net-questdb-client-tests.csproj'
    arguments: '--configuration $(buildConfiguration) --framework net8.0 --no-build --verbosity normal --logger trx --blame-hang --blame-hang-timeout 600s --blame-hang-dump-type mini --filter "FullyQualifiedName!~QuestDbIntegrationTests&FullyQualifiedName!~QuestDbWebSocketIntegrationTests&FullyQualifiedName!~QuestDbQueryIntegrationTests"'
    publishTestResults: true

- task: DotNetCoreCLI@2
  displayName: 'Run all tests on $(osName) (net9.0, with coverage)'
  inputs:
    command: 'test'
    projects: 'src/net-questdb-client-tests/net-questdb-client-tests.csproj'
    arguments: '--configuration $(buildConfiguration) --framework net9.0 --no-build --verbosity normal --logger trx --blame-hang --blame-hang-timeout 600s --blame-hang-dump-type mini --collect:"XPlat Code Coverage"'
    publishTestResults: true
  env:
    QUESTDB_REPO: $(QUESTDB_REPO)
    # QuestDbManager tees each launched server's full stdout/stderr here; published on failure below.
    QDB_SERVER_LOG_DIR: $(Build.ArtifactStagingDirectory)/ServerLogs
  condition: eq(variables['osName'], 'Linux')

# Docker-backed test fixtures (opt-in via QDB_DOCKER_TESTS): the QuestDbDocker* suites — ingest
# fault-tolerance and egress query — bundled into one step since they share the opt-in and the
# Linux Docker daemon. Linux only: the hosted ubuntu agent ships a Linux Docker daemon; the
# Windows/macOS agents don't, so it must stay Linux-scoped. The fixtures self-skip everywhere the
# env var is unset (all other legs). Each fixture manages its own container; both default to
# questdb/questdb:nightly (the /write/v4 QWP ingest and /read/v1 egress endpoints are master-only)
# so the image is pulled once and cached.
- task: DotNetCoreCLI@2
  displayName: 'Run Docker test fixtures on $(osName) (net9.0)'
  inputs:
    command: 'test'
    projects: 'src/net-questdb-client-tests/net-questdb-client-tests.csproj'
    arguments: '--configuration $(buildConfiguration) --framework net9.0 --no-build --verbosity normal --logger trx --blame-hang --blame-hang-timeout 600s --blame-hang-dump-type mini --filter "FullyQualifiedName~QuestDbDocker"'
    publishTestResults: true
  env:
    QDB_DOCKER_TESTS: 'on'
  condition: eq(variables['osName'], 'Linux')

- task: DotNetCoreCLI@2
  displayName: 'Run tests on $(osName) (net9.0, excluding integration tests)'
  inputs:
    command: 'test'
    projects: 'src/net-questdb-client-tests/net-questdb-client-tests.csproj'
    arguments: '--configuration $(buildConfiguration) --framework net9.0 --no-build --verbosity normal --logger trx --blame-hang --blame-hang-timeout 600s --blame-hang-dump-type mini --collect:"XPlat Code Coverage" --filter "FullyQualifiedName!~QuestDbIntegrationTests&FullyQualifiedName!~QuestDbWebSocketIntegrationTests&FullyQualifiedName!~QuestDbQueryIntegrationTests"'
    publishTestResults: true
  condition: ne(variables['osName'], 'Linux')

- task: DotNetCoreCLI@2
  displayName: 'Run all tests on $(osName) (net10.0)'
  inputs:
    command: 'test'
    projects: 'src/net-questdb-client-tests/net-questdb-client-tests.csproj'
    arguments: '--configuration $(buildConfiguration) --framework net10.0 --no-build --verbosity normal --logger trx --blame-hang --blame-hang-timeout 600s --blame-hang-dump-type mini --filter "FullyQualifiedName!~QuestDbIntegrationTests&FullyQualifiedName!~QuestDbWebSocketIntegrationTests&FullyQualifiedName!~QuestDbQueryIntegrationTests"'
    publishTestResults: true

# Dedicated project with NO reference to net-questdb-client-zstd/ZstdSharp.Port, proving the
# plugin-absent degrade/fail-fast behavior against the real Assembly.Load path rather than the
# main test project, which always carries the plugin via ProjectReference.
- task: DotNetCoreCLI@2
  displayName: 'Run zstd-plugin-absent tests on $(osName) (net8.0)'
  inputs:
    command: 'test'
    projects: 'src/net-questdb-client-zstd-absent-tests/net-questdb-client-zstd-absent-tests.csproj'
    arguments: '--configuration $(buildConfiguration) --framework net8.0 --no-build --verbosity normal --logger trx --blame-hang --blame-hang-timeout 600s --blame-hang-dump-type mini'
    publishTestResults: true

# Dedicated project whose own build output takes the plugin's assembly name and carries a
# ZstdDecompressor whose constructor throws, proving TryResolveFactory's create+dispose probe
# (not just Assembly.Load itself, already covered above) correctly reports the plugin unavailable.
- task: DotNetCoreCLI@2
  displayName: 'Run zstd-plugin-broken tests on $(osName) (net8.0)'
  inputs:
    command: 'test'
    projects: 'src/net-questdb-client-zstd-broken-tests/net-questdb-client-zstd-broken-tests.csproj'
    arguments: '--configuration $(buildConfiguration) --framework net8.0 --no-build --verbosity normal --logger trx --blame-hang --blame-hang-timeout 600s --blame-hang-dump-type mini'
    publishTestResults: true

# Publish the QuestDB server logs captured by QuestDbManager when the integration leg fails, so an
# integration failure can be diagnosed without re-running (mkdir guard keeps publish from erroring
# when a failure happened before any server launched).
- bash: mkdir -p "$(Build.ArtifactStagingDirectory)/ServerLogs"
  displayName: 'Ensure server-log dir ($(osName))'
  condition: and(failed(), eq(variables['osName'], 'Linux'))

- task: PublishPipelineArtifact@1
  displayName: 'Publish QuestDB server logs on failure ($(osName))'
  condition: and(failed(), eq(variables['osName'], 'Linux'))
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/ServerLogs'
    artifact: 'ServerLogs-$(osName)-$(Build.BuildId)'
    publishLocation: 'pipeline'

- task: CopyFiles@2
  displayName: 'Stage hang dumps + trx ($(osName))'
  condition: always()
  inputs:
    sourceFolder: '$(Agent.TempDirectory)'
    contents: |
      **/*.dmp
      **/*Sequence*.xml
      **/*.trx
    targetFolder: '$(Build.ArtifactStagingDirectory)/TestArtifacts'

- task: PublishPipelineArtifact@1
  displayName: 'Publish hang dumps + trx ($(osName))'
  condition: always()
  inputs:
    targetPath: '$(Build.ArtifactStagingDirectory)/TestArtifacts'
    artifact: 'TestArtifacts-$(osName)-$(Build.BuildId)'
    publishLocation: 'pipeline'

- task: PublishCodeCoverageResults@2
  displayName: 'Publish code coverage'
  inputs:
    summaryFileLocation: '$(Agent.TempDirectory)/**/coverage.cobertura.xml'
    codecoverageTool: 'cobertura'
  condition: succeededOrFailed()
